<main class="min-h-dvh bg-background px-6 text-body sm:px-8 lg:px-12">
  <section
    class="mx-auto grid min-h-dvh w-full max-w-6xl items-center gap-8 py-10 text-center md:grid-cols-[minmax(0,0.95fr)_minmax(320px,500px)] md:gap-12 md:py-0 md:text-left"
    aria-labelledby="not-found-title"
  >
    <div class="order-2 max-w-xl space-y-6 md:order-1">
      <div class="space-y-3">
        <p class="text-xs font-semibold uppercase tracking-[0.05em] text-secondary-foreground">
          Error 404
        </p>
        <h1 id="not-found-title" class="text-[1.75rem] font-bold leading-tight text-heading">
          Page not found
        </h1>
        <p class="text-sm leading-6 text-body">
          The page may have moved, been removed, or the link is no longer available. Use the navigation to return to a known workspace.
        </p>
      </div>

      <nav class="flex flex-col gap-3 sm:flex-row md:justify-start" aria-label="Not found page actions">
        <a
          routerLink="/tickets"
          class="inline-flex items-center justify-center rounded-base bg-primary px-5 py-2.5 text-sm font-semibold text-primary-foreground transition-colors duration-200 hover:bg-primary-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
        >
          Go to tickets
        </a>
        <a
          routerLink="/"
          class="inline-flex items-center justify-center rounded-base border border-border bg-background px-5 py-2.5 text-sm font-semibold text-heading transition-colors duration-200 hover:border-primary hover:bg-secondary hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
        >
          Return home
        </a>
      </nav>
    </div>

    <div class="order-1 flex w-full justify-center md:order-2" aria-hidden="true">
      <img
        ngSrc="/images/404.png"
        width="1536"
        height="1024"
        priority
        alt=""
        class="h-auto w-full max-w-[420px] md:max-w-[620px]"
      />
    </div>
  </section>
</main>
