<main class="p-4 md:p-8">
  <h2 class="text-xl font-semibold mb-4">Subscribers</h2>

    <p class="mb-3">Total: {{ subscribers.length }}</p>

    <p-table 
      [value]="subscribers"
      [tableStyle]="{ 'min-width': '50rem' }"
      
    >

      <!-- HEADER -->
      <ng-template pTemplate="header">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Created</th>
        </tr>
      </ng-template>

      <!-- BODY -->
      <ng-template pTemplate="body" let-subscriber>
        <tr>
          <td>{{ subscriber.name || 'No name' }}</td>
          <td>{{ subscriber.email }}</td>
          <td>{{ subscriber.createdAt | date: 'medium' }}</td>
        </tr>
      </ng-template>

    </p-table>

</main>
