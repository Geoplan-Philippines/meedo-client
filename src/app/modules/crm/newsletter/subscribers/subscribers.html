<app-page heading="Subscribers" subtitle="Manage your newsletter audience">
  <button pageActions pButton type="button" class="coming-soon" severity="secondary" [outlined]="true" icon="pi pi-download" label="Export" aria-disabled="true" title="Coming soon"></button>

  <app-stat-strip pageSummary label="Subscriber statistics" [items]="statItems()" />

  <p-iconfield pageToolbar class="ds-search">
    <p-inputicon class="pi pi-search" />
    <input
      pInputText
      type="search"
      placeholder="Search by name or email…"
      aria-label="Search subscribers"
      (input)="onSearch($event)"
    />
  </p-iconfield>
  <button pageToolbarEnd pButton type="button" class="coming-soon" severity="secondary" [outlined]="true" icon="pi pi-filter" label="Filter" aria-disabled="true" title="Coming soon"></button>

  <div>
    @if (isLoading()) {
      <div class="ds-table-skeleton" role="status" aria-label="Loading subscribers">
        @for (row of skeletonRows; track row) {
          <div class="skeleton-row">
            <p-skeleton shape="circle" size="1.75rem" />
            <p-skeleton width="9rem" height="0.75rem" />
            <p-skeleton width="13rem" height="0.75rem" />
            <p-skeleton width="8rem" height="0.75rem" />
          </div>
        }
      </div>
    } @else {
      <p-table
        class="ds-table"
        [value]="pager.pageRows()"
        [lazy]="true"
        (onLazyLoad)="pager.onSort($event)"
        [tableStyle]="{ 'width': '100%' }"
        [rowHover]="true"
      >
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="name" scope="col">Name <p-sortIcon field="name" /></th>
            <th pSortableColumn="email" scope="col">Email <p-sortIcon field="email" /></th>
            <th pSortableColumn="createdAt" scope="col">Subscribed on <p-sortIcon field="createdAt" /></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-subscriber>
          <tr>
            <td>
              <div class="subscriber-identity">
                <span [class]="getAvatarClass(subscriber)" aria-hidden="true">{{ getInitials(subscriber) }}</span>
                <span class="subscriber-name" [class.ds-muted]="!subscriber.name">{{ subscriber.name || 'No name' }}</span>
              </div>
            </td>
            <td>
              <a class="subscriber-email" [href]="'mailto:' + subscriber.email">{{ subscriber.email }}</a>
            </td>
            <td class="subscriber-date">{{ subscriber.createdAt | date: 'MMM d, y' }}</td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="3">
              <app-empty-state
                heading="No subscribers found"
                [description]="searchTerm() ? 'No subscribers match your search. Try different keywords.' : 'Your newsletter has no subscribers yet.'"
              />
            </td>
          </tr>
        </ng-template>
      </p-table>
      <app-list-paginator
        [total]="pager.total()"
        [page]="pager.currentPage()"
        [pageSize]="pager.pageSize()"
        itemLabel="subscribers"
        (pageChange)="pager.onPage($event)"
      />
    }
  </div>
</app-page>
