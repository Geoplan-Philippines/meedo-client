
  <p>Total: {{ leads.length }}</p>

  <p-table 
    [value]="leads"
    [tableStyle]="{ 'min-width': '60rem' }"
    
  >

    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Company</th>
        <th>Message</th>
        <th>Status</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-lead>
      <tr>
        <td>{{ lead.firstName }} {{ lead.lastName }}</td>
        <td>{{ lead.email }}</td>
        <td>{{ lead.phoneNumber || '—' }}</td>
        <td>{{ lead.company || '—' }}</td>
        <td>{{ lead.message || '—' }}</td>
        <td>{{ lead.status || '—' }}</td>
      </tr>
    </ng-template>  

  </p-table>
