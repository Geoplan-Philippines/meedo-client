<app-page heading="Attendance" subtitle="Define how time is scheduled and counted: shifts and weekly schedules set the expected hours, holidays and the policy shape how those hours are paid, and assignments decide who follows what.">
  <nav pageBreadcrumb class="text-muted" aria-label="Breadcrumb">
    <a routerLink="/settings" class="hover:text-primary transition-colors">Settings</a>
    <span class="mx-2 opacity-60" aria-hidden="true">/</span>
    <span class="text-heading" aria-current="page">Attendance</span>
  </nav>

  <ul class="ds-rows area-list">
    @for (area of areas; track area.route) {
      <li>
        <a [routerLink]="area.route" class="area-link">
          <span class="area-icon" aria-hidden="true"><i [class]="'pi ' + area.icon"></i></span>
          <span class="area-text">
            <span class="area-label">{{ area.label }}</span>
            <span class="area-desc">{{ area.description }}</span>
          </span>
          <i class="pi pi-angle-right area-chevron" aria-hidden="true"></i>
        </a>
      </li>
    }
  </ul>
</app-page>
