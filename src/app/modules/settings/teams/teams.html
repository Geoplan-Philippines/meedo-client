<p-toast />
<p-confirmDialog />

<app-page heading="Teams" subtitle="Add, edit, and manage teams.">
  @if (isAdmin()) {
    <p-button pageActions label="New Team" icon="pi pi-plus" (onClick)="openCreateDialog()" />
  }

  <div>
    <p-table
      class="ds-table"
      [value]="pager.pageRows()"
      [lazy]="true"
      (onLazyLoad)="pager.onSort($event)"
      [loading]="isLoading()"
      [rowHover]="true"
      [tableStyle]="{ 'width': '100%' }"
    >
      <ng-template pTemplate="header">
        <tr>
          <th scope="col" pSortableColumn="name">Name <p-sortIcon field="name" /></th>
          <th scope="col" pSortableColumn="createdAt">Created <p-sortIcon field="createdAt" /></th>
          @if (isAdmin()) {
            <th scope="col" class="text-right" style="width: 8rem"><span class="ds-sr-only">Actions</span></th>
          }
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-team>
        <tr>
          <td class="font-medium text-heading">{{ team.name }}</td>
          <td class="text-muted ds-num">{{ team.createdAt | date: 'mediumDate' }}</td>
          @if (isAdmin()) {
            <td class="text-right">
              <div class="inline-flex gap-1">
                <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" size="small" severity="secondary" (onClick)="openEditDialog(team)" ariaLabel="Edit team" />
                <p-button
                  icon="pi pi-trash"
                  [text]="true"
                  [rounded]="true"
                  size="small"
                  severity="danger"
                  (onClick)="confirmDelete(team)"
                  ariaLabel="Delete team"
                  [loading]="isDeleting()"
                  [disabled]="isDeleting()"
                />
              </div>
            </td>
          }
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td [attr.colspan]="isAdmin() ? 3 : 2">
            <app-empty-state icon="pi pi-sitemap" heading="No teams found" />
          </td>
        </tr>
      </ng-template>
    </p-table>
    <app-list-paginator
      [total]="pager.total()"
      [page]="pager.currentPage()"
      [pageSize]="pager.pageSize()"
      itemLabel="teams"
      (pageChange)="pager.onPage($event)"
    />
  </div>
</app-page>

<p-dialog
  [header]="isEditing() ? 'Edit Team' : 'New Team'"
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [modal]="true"
  [style]="{ width: '400px' }"
>

  <form [formGroup]="teamForm" class="flex flex-col gap-4 pt-2">
    <div class="flex flex-col gap-1">
      <label for="team-name" class="text-sm font-medium">Name</label>
      <input
        id="team-name"
        pInputText
        formControlName="name"
        placeholder="Team name"
        required
      />
    </div>

  </form>

  <ng-template pTemplate="footer">
    <p-button
      label="Cancel"
      [text]="true"
      severity="secondary"
      (onClick)="dialogVisible.set(false)"
    />
    <p-button
      [label]="isEditing() ? 'Update' : 'Create'"
      [loading]="isSaving()"
      [disabled]="teamForm.invalid || isSaving()"
      (onClick)="saveTeam()"
    />
  </ng-template>
</p-dialog>
