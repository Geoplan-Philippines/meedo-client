<app-page heading="Settings" subtitle="Configure your workspace.">
  @for (group of groups(); track group.label) {
    <section class="settings-group">
      <h2>{{ group.label }}</h2>
      <ul>
        @for (card of group.cards; track card.label) {
          <li>
            <a [routerLink]="card.route" class="settings-link">
              <span class="settings-icon" aria-hidden="true"><i [class]="'pi ' + card.icon"></i></span>
              <span class="settings-text">
                <h3>{{ card.label }}</h3>
                <span class="settings-desc">{{ card.description }}</span>
              </span>
              <i class="pi pi-angle-right settings-chevron" aria-hidden="true"></i>
            </a>
          </li>
        }
      </ul>
    </section>
  }
  @if (canManageUsers()) { <app-apptivo-sync-panel /> }
</app-page>
