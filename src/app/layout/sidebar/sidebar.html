@if (layoutService.sidebarOpen()) {
  <div
    class="fixed inset-0 bg-foreground/20 z-30 md:hidden transition-opacity"
    (click)="layoutService.closeSidebar()"
    aria-hidden="true"
  ></div>
}

<aside
  class="absolute inset-y-0 left-0 z-40 w-64 bg-surface border-r border-border transform transition-transform duration-200 ease-in-out md:relative md:translate-x-0 md:h-full overflow-y-auto"
  class="sidebar-shell absolute inset-y-0 left-0 z-40 w-64 bg-background border-r border-border transform transition-[transform,width] duration-200 ease-in-out md:relative md:translate-x-0 md:h-full md:overflow-visible"
  [class.-translate-x-full]="!layoutService.sidebarOpen()"
  [class.translate-x-0]="layoutService.sidebarOpen()"
  [attr.aria-label]="layoutService.sidebarCollapsed() ? 'Collapsed main navigation' : 'Main navigation'"
>
  <button
    type="button"
    class="sidebar-border-toggle hidden md:inline-flex absolute top-4 -right-4 z-50 h-8 w-8 items-center justify-center rounded-full border border-border bg-background text-body shadow-sm hover:bg-secondary hover:text-heading focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring transition-colors"
    (click)="layoutService.toggleSidebarCollapsed()"
    [attr.aria-label]="layoutService.sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    [attr.aria-expanded]="!layoutService.sidebarCollapsed()"
  >
    <i
      class="pi text-sm"
      [class.pi-angle-left]="!layoutService.sidebarCollapsed()"
      [class.pi-angle-right]="layoutService.sidebarCollapsed()"
      aria-hidden="true"
    ></i>
  </button>

  <nav class="sidebar-nav flex flex-col gap-6 p-4 min-h-full md:h-full md:overflow-y-auto">
    @for (section of sections(); track section.title) {
      <div>
        <h3 class="sidebar-section-title mb-2 px-3 text-[11px] font-medium tracking-wider text-body/60 uppercase">
          {{ section.title }}
        </h3>
        <ul class="flex flex-col gap-0.5">
          @for (item of section.items; track item.route) {
            <li>
              <a
                [routerLink]="item.route"
                [class]="isActive(item.route)
                  ? 'bg-secondary text-secondary-foreground font-medium'
                  : 'text-body hover:bg-secondary/60'"
                class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-md text-sm transition-colors cursor-pointer"
                [attr.aria-current]="isActive(item.route) ? 'page' : null"
                [attr.title]="layoutService.sidebarCollapsed() ? item.label : null"
                (click)="layoutService.closeSidebar()"
              >
                <i
                  [class]="'pi ' + item.icon + ' text-base w-4 text-center shrink-0'"
                  [class.opacity-60]="!isActive(item.route)"
                  aria-hidden="true"
                ></i>
                <span class="sidebar-label truncate">{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>
</aside>
