@if (layoutService.sidebarOpen()) {
  <div
    class="fixed inset-0 bg-foreground/20 z-30 md:hidden transition-opacity"
    (click)="layoutService.closeSidebar()"
    aria-hidden="true"
  ></div>
}

<aside
  class="absolute inset-y-0 left-0 z-40 w-64 bg-background border-r border-border transform transition-transform duration-200 ease-in-out md:relative md:translate-x-0 md:h-full overflow-y-auto"
  [class.-translate-x-full]="!layoutService.sidebarOpen()"
  [class.translate-x-0]="layoutService.sidebarOpen()"
>
  <nav class="flex flex-col gap-6 p-4 min-h-full">
    @for (section of sections(); track section.title) {
      <div>
        <h3 class="mb-2 px-3 text-[11px] font-medium tracking-wider text-body/60 uppercase">
          {{ section.title }}
        </h3>
        <ul class="flex flex-col gap-0.5">
          @for (item of section.items; track item.route) {
            <li>
              <a
                [routerLink]="item.route"
                [class]="isActive(item.route)
                  ? 'bg-secondary text-secondary-foreground font-medium'
                  : 'text-body hover:bg-secondary/60'"
                class="flex items-center gap-3 px-3 py-2 rounded-md text-sm transition-colors cursor-pointer"
                [attr.aria-current]="isActive(item.route) ? 'page' : null"
                (click)="layoutService.closeSidebar()"
              >
                <i
                  [class]="'pi ' + item.icon + ' text-base w-4 text-center'"
                  [class.opacity-60]="!isActive(item.route)"
                ></i>
                <span class="truncate">{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>
</aside>
