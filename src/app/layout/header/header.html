<header class="h-16 px-4 border-b border-border bg-background flex justify-between items-center relative">
  <div class="flex items-center gap-3">
    <p-button 
      icon="pi pi-bars" 
      [text]="true" 
      severity="secondary" 
      class="md:hidden" 
      (onClick)="layoutService.toggleSidebar()" 
      aria-label="Toggle Menu" 
    />
    
    <span class="text-xl font-bold tracking-tight text-heading">MeedoV3</span>
  </div>

  <div class="flex items-center gap-2">
    <p-button icon="pi pi-bell" [text]="true" severity="secondary" />
    <p-button icon="pi pi-cog" [text]="true" severity="secondary" />
    <p-avatar
      shape="circle"
      image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
      class="w-8 h-8 cursor-pointer border-border border-2 hover:border-primary transition-colors ml-2"
      [attr.aria-label]="'User profile'"
    />
  </div>
</header>
