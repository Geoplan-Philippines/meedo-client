<header class="h-16 px-4 border-b border-border bg-background flex justify-between items-center relative">
  <div class="flex items-center gap-3">
    <p-button 
      icon="pi pi-bars" 
      [text]="true" 
      severity="secondary" 
      class="md:hidden" 
      (onClick)="layoutService.toggleSidebar()" 
      aria-label="Toggle Menu" 
    />
    
    <span class="text-xl font-bold text-heading">MeedoV3</span>
  </div>

  <div class="flex items-center gap-2">
    <p-button
      [icon]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
      [text]="true"
      severity="secondary"
      (onClick)="themeService.toggle()"
      [attr.aria-label]="themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
    />
    <p-button icon="pi pi-bell" [text]="true" severity="secondary" />
    <p-button
      icon="pi pi-cog"
      [text]="true"
      severity="secondary"
      (onClick)="goToSettings()"
      aria-label="Settings"
    />
    <p-avatar
      shape="circle"
      image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
      class="w-8 h-8 cursor-pointer border-border border-2 hover:border-primary transition-colors ml-2"
      [attr.aria-label]="'User profile'"
    />
    <span>{{ currentUser()?.name }}</span>
    <p-button
      icon="pi pi-sign-out"
      [text]="true"
      severity="secondary"
      (onClick)="logout()"
      aria-label="Sign out"
    />
  </div>
</header>
