<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MeedoV3</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the stored theme before Angular boots to avoid a light flash
    // for returning dark-mode users. Mirrors ThemeService (key: 'app-theme').
    try {
      if (localStorage.getItem('app-theme') === 'dark') {
        document.documentElement.classList.add('app-dark');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
